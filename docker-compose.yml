services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartstudy-postgres
    environment:
      POSTGRES_USER: smartstudy
      POSTGRES_PASSWORD: smartstudy
      POSTGRES_DB: smartstudy
    ports:
      - "5432:5432"
    volumes:
      - smartstudy_pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    container_name: smartstudy-mysql
    environment:
      MYSQL_DATABASE: smartstudy
      MYSQL_USER: smartstudy
      MYSQL_PASSWORD: smartstudy
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - smartstudy_mysql_data:/var/lib/mysql

volumes:
  smartstudy_pgdata:
  smartstudy_mysql_data:
